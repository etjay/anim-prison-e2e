# CI: WeChat DevTools E2E（社区移植版 + Jest + 全程录像 + 产物上传）
#
# 触发：push → main，以及 PR → main。
# 依据：docs/spike-devtools-automator.md §6（CI 化建议）+ docs/environment.md。
# 职责边界（部署运维）：本文件只负责「构建/发布/环境/基础设施」——装依赖、装 DevTools、
#   起 mock-server、跑 e2e、收产物；不改 e2e/ 测试代码与 miniprogram/ 业务代码。
#
# 说明：
# - 全程在 ubuntu-latest（24.04，与本地开发环境同构）单机完成，无需 Docker。
# - DevTools 走 scripts/install-devtools.sh（社区移植版 msojocs，dpkg -x 解包到 ~/wechat-devtools），
#   与 e2e/tools/ensure-devtools.js 的 devtoolsRoot() 发现逻辑（~/wechat-devtools/app/opt/apps/.../files/bin）对齐。
# - E2E_RECORD=1 由 e2e/global.setup.js 在 DevTools 启动前拉起 ffmpeg x11grab 录 :97，
#   落 e2e/artifacts/*.mp4（mp4 文件名带时间戳，glob 收集）。
# - Xvfb :97 由本流水线在 `npm run e2e` 前预启（startRecording() 先于 ensureDevtools() 轮询
#   X socket，全新 runner 上若不预启，mp4 录像会被静默跳过）；ensureX11Display() 幂等复用。
# - 冷机首屏编译 >30s 会撞 e2e/helpers/runtime.js 的 waitForAppReady 30s 硬上限（测试域，
#   CI 侧不改）。scripts/e2e-prewarm.js 在测试前用**独立端口 9421**（避开通道 9420 的孤儿
#   renderer 占用）编译首屏。关键：预热**复用测试域的 ensureDevtools()**（只读 import）先把 IDE
#   冷启出来（nw 二进制冷启，CI ~9-15s），再 automator.launch 仅建隧道 + 编译首屏（CI ~13s）——
#   与测试自己 globalSetup→bootstrap 的分段一致；若让 `cli auto` 一步到位「冷启 + 建隧道」，
#   冷机实测 >60s 会撞 automator.launch 超时（见 run #3）。把 on-disk 编译缓存
#   （~/.config/wechat-devtools/WeappCache/，按工程 hash 存盘、与端口无关）焐热，随后 cli quit 干净退出；
#   globalSetup 每轮 stopAllIde 冷启新 IDE（补丁 D），但编译缓存在盘、跨 IDE 重启存活 →
#   测试重编译走热缓存，waitForAppReady 秒过。预热失败不阻断。
# - Jest JSON 走 CLI 旗标注入（不改 e2e/ 配置）：--json --outputFile=e2e/reports/jest.json。
# - 录像/截图/Jest JSON 三类产物无论成败都上传（if: always()），保留 14 天。

name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: WeChat DevTools E2E (record + artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WDT_DISPLAY: ":97"   # 固定 display，避免与 runner 上其他 X 会话冲突（spike §6）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 运行期依赖：ffmpeg(录像) / xvfb(虚拟显示) / x11vnc(可选排障) + DevTools 所需
          # GTK3/Chromium/nwjs 共享库（按 ldd(nw)+dpkg -S 在 24.04 上核实；t64 为 noble 变体名）。
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb x11vnc curl ca-certificates \
            fontconfig fonts-noto-cjk xfonts-base \
            libnss3 libnspr4 \
            libatk1.0-0t64 libatspi2.0-0t64 libcups2t64 \
            libdbus-1-3 libdrm2 libgbm1 libasound2t64 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxi6 \
            libxrandr2 libxrender1 libxshmfence1 libxkbcommon0 \
            libxcb1 libxcb-render0 libxcb-shm0 \
            libx11-6 libx11-xcb1 libxau6 libxdmcp6 \
            libxcursor1 libxtst6 libxss1 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libglib2.0-0t64 libfreetype6 libfontconfig1 \
            libgraphite2-3 libharfbuzz0b \
            libexpat1
          sudo ldconfig

      - name: Install root node deps
        run: npm ci

      - name: Install WeChat DevTools (community port)
        run: bash scripts/install-devtools.sh

      - name: Verify DevTools shared libs resolve
        run: |
          NW="$(find "$HOME/wechat-devtools" -path '*nwjs/nw' -type f 2>/dev/null | head -n1)"
          [ -n "$NW" ] || { echo "未找到 nw 可执行文件（DevTools 安装异常）" >&2; exit 1; }
          echo "nw: $NW"
          missing="$(ldd "$NW" 2>/dev/null | grep -i 'not found' || true)"
          if [ -n "$missing" ]; then
            echo "缺少共享库（请补入 apt 依赖清单）：" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "DevTools 共享库全部解析成功。"

      - name: Install mock-server deps
        run: cd mock-server && npm ci

      - name: Start mock-server
        run: |
          cd mock-server
          nohup npm run start:dev > "../mock-server.log" 2>&1 &
          echo "mock-server pid: $!"
          disown || true

      - name: Wait for mock-server /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsSL http://127.0.0.1:3000/health >/dev/null 2>&1; then
              echo "mock-server 就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "mock-server 60s 内未就绪，日志：" >&2
          tail -n 50 mock-server.log >&2 || true
          exit 1

      - name: Pre-start Xvfb :97 (so E2E_RECORD captures the whole session)
        run: |
          set -euo pipefail
          # e2e/global.setup.js 中 startRecording() 先于 ensureDevtools() 运行：它先轮询
          # /tmp/.X11-unix/X97（15s），拿不到 socket 就放弃录像。全新 runner 上 Xvfb 尚未
          # 启动 → 若不预启，mp4 全程录像会被静默跳过（本地能录是因 Xvfb 常驻）。
          # ensureX11Display() 幂等：Xvfb 已在跑且 socket 存在则直接复用，不会二次冷启。
          if ! pgrep -x Xvfb >/dev/null 2>&1; then
            nohup Xvfb :97 -screen 0 1280x800x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
            disown || true
          fi
          for i in $(seq 1 20); do [ -S /tmp/.X11-unix/X97 ] && break; sleep 0.5; done
          [ -S /tmp/.X11-unix/X97 ] || { echo "Xvfb :97 未在 10s 内就绪" >&2; tail -n 20 /tmp/xvfb.log >&2 || true; exit 1; }
          echo "Xvfb :97 已就绪（socket 存在，E2E_RECORD 可全程录像）。"

      - name: Pre-warm DevTools first frame (warm on-disk compile cache)
        env:
          DISPLAY: ":97"          # IDE(nw, GUI) 须有 DISPLAY 才能起进程 + 建隧道（与 WDT_DISPLAY 一致）
          E2E_PREWARM_PORT: "9421"   # 预热专用隧道端口，刻意不同于测试的 9420（避免孤儿 renderer 占 9420）
          E2E_PREWARM_TIMEOUT: "180000"   # 冷机首屏编译上限：run #11 实测 90s 仍未就绪 → 翻倍到 180s，让首屏编译真正跑完、缓存焐热
        continue-on-error: true
        run: |
          # 为什么：冷机（CI 共享 runner）首屏编译实测 >30s，会撞 waitForAppReady 的 30s 硬上限。
          # 做什么：复用测试域 ensureDevtools() 先把 IDE 冷启出来（快路径），再 automator.launch
          #   仅建隧道 + 编译首屏，把 on-disk 编译缓存焐热（缓存按工程 hash 存盘、与隧道端口无关）；
          #   随后 stopAllIde() 干净退出主 IDE（分段启动避免 `cli auto` 冷启 + 建隧道一步 >60s）。
          # 为什么用 9421 而非 9420：持隧道的 appservice renderer 在 cli quit / stopAllIde 的 pkill
          #   正则下都会漏杀而孤儿化（其 cmdline 中 --type=renderer 在 DT_ROOT 之前，正则不匹配）。
          #   若预热也占 9420，孤儿会一直占着 9420，测试 cli auto --auto-port 9420 监听不上。
          #   用 9421：孤儿占 9421，9420 干净留给测试。
          # 生效点：后续 `npm run e2e` 的 globalSetup 会 stopAllIde 冷启新 IDE（补丁 D），但编译缓存
          #   在盘、跨重启存活 → 测试重编译走热缓存，waitForAppReady 秒过。
          # 失败处理：continue-on-error → 预热挂了测试仍跑（bootstrap 自行 launch 兜底），最坏等于无预热。
          node scripts/e2e-prewarm.js

      - name: Run E2E (with full screen recording)
        env:
          E2E_RECORD: "1"
          # CI 冷机首屏重编译可能偏慢：把 waitForAppReady 的默认 30s 上限放宽到 90s。
          # 该变量由 e2e/helpers/runtime.js 读取（不设则本地默认 30s 不变）；部署侧注入、不改变本地行为。
          E2E_APP_READY_TIMEOUT_MS: "90000"
        run: |
          # 注：上一步预热已焐热 on-disk 编译缓存，本步冷启 IDE 后重编译走热缓存；
          #   即便缓存仅部分焐热，E2E_APP_READY_TIMEOUT_MS=90s 也给重编译留足余量。
          # e2e/reports 需先存在（jest --outputFile 不建目录）；artifacts/screenshots 亦确保存在。
          mkdir -p e2e/reports e2e/artifacts e2e/screenshots
          # --json --outputFile 为 CLI 旗标注入，不改动 e2e/jest.config.js（e2e/ 归测试）。
          npm run e2e -- --json --outputFile=e2e/reports/jest.json

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_number }}
          path: |
            e2e/artifacts/
            e2e/screenshots/
            e2e/reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop mock-server
        if: always()
        run: |
          pkill -f "node server.js" 2>/dev/null || true
          echo "mock-server 已停止。"